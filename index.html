<html lang="pl">
<head>

<title>Pixel Runner — gra na Androida</title>

<meta property="og:description" content="Przelatuj między ołówkami, zbieraj monety i bij swój rekord!">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap">
<style>
  :root {
    --paper: #fbfaf4;
    --line: #d6e4f2;
    --margin: #f2b8b8;
    --ink: #2b2620;
    --muted: #6b6457;
    --card: #ffffff;
    --border: #2b2620;
    --sky: #58b0e6;
    --sky-light: #aadef5;
    --coin: #ffd43b;
    --coin-dark: #e0a81e;
    --red: #ff6b6b;
    --green: #51cf66;
    --blue: #4dabf7;
    --ground: #a86f45;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1b1d24;
      --line: #262a35;
      --margin: #4a2a2e;
      --ink: #f1ede3;
      --muted: #a9a293;
      --card: #242732;
      --border: #0c0d10;
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(90deg, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px),
      repeating-linear-gradient(180deg, transparent 0 31px, var(--line) 31px 32px);
    font-family: "Nunito", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    overflow-x: hidden;
  }
  img { max-width: 100%; height: auto; display: block; image-rendering: pixelated; }
  a { color: inherit; }
  .pixel { font-family: "Press Start 2P", monospace; letter-spacing: 0.02em; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 0 56px; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand img { width: 40px; height: 40px; border: 3px solid var(--border); border-radius: 10px; }
  .brand span { font-size: 13px; }
  .lang {
    display: flex; border: 3px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .lang button {
    font: inherit; font-family: "Press Start 2P", monospace; font-size: 10px;
    padding: 8px 10px; border: 0; cursor: pointer; background: var(--card); color: var(--ink);
  }
  .lang button[aria-pressed="true"] { background: var(--coin); color: #2b2620; }

  /* ---------- hero ---------- */
  .hero {
    display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center;
    padding: 28px 0 56px;
  }
  .hero h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(30px, 6vw, 56px);
    line-height: 1.25; margin: 0 0 20px;
    color: #fff3c4;
    text-shadow: 4px 4px 0 var(--border), -2px -2px 0 var(--border), 2px -2px 0 var(--border), -2px 2px 0 var(--border);
  }
  .hero h1 .runner { color: var(--coin); }
  .hero p.lead { font-size: 20px; font-weight: 700; margin: 0 0 28px; max-width: 34ch; }

  .btn-play {
    display: inline-flex; align-items: center; gap: 12px;
    background: #111; color: #fff; text-decoration: none;
    border: 3px solid var(--border); border-radius: 12px;
    padding: 12px 22px 12px 16px;
    box-shadow: 5px 5px 0 var(--border);
    transition: transform .08s, box-shadow .08s;
  }
  .btn-play:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--border); }
  .btn-play:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--border); }
  .btn-play svg { width: 30px; height: 30px; flex: none; }
  .btn-play small { display: block; font-size: 11px; opacity: .8; line-height: 1.2; }
  .btn-play strong { display: block; font-size: 20px; line-height: 1.2; }
  .free-note { margin-top: 14px; font-size: 14px; color: var(--muted); }

  .phone {
    justify-self: center;
    width: min(300px, 80vw);
    border: 6px solid var(--border); border-radius: 28px;
    background: var(--border); padding: 8px;
    box-shadow: 10px 10px 0 rgba(0,0,0,.18);
    transform: rotate(3deg);
    position: relative;
  }
  .phone img { border-radius: 18px; image-rendering: auto; }
  .coin-float {
    position: absolute; width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--coin-dark) 0 38%, var(--coin) 40%);
    border: 3px solid var(--border);
    animation: bob 2.4s ease-in-out infinite;
  }
  .coin-float.c1 { top: 12%; left: -34px; }
  .coin-float.c2 { top: 46%; right: -30px; animation-delay: .6s; width: 30px; height: 30px; }
  .coin-float.c3 { bottom: 10%; left: -22px; animation-delay: 1.2s; width: 26px; height: 26px; }
  @keyframes bob { 50% { transform: translateY(-12px); } }
  @media (prefers-reduced-motion: reduce) { .coin-float { animation: none; } }

  /* ---------- banner ---------- */
  .banner {
    border: 4px solid var(--border); border-radius: 16px; overflow: hidden;
    box-shadow: 8px 8px 0 var(--border);
    margin: 0 0 72px;
  }

  /* ---------- sections ---------- */
  section { margin: 0 0 72px; }
  h2 {
    font-family: "Press Start 2P", monospace; font-size: clamp(16px, 2.6vw, 22px);
    line-height: 1.5; margin: 0 0 28px;
  }
  h2 .hl { background: var(--coin); color: #2b2620; padding: 4px 8px; border: 3px solid var(--border); border-radius: 6px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .stat {
    background: var(--card); border: 3px solid var(--border); border-radius: 12px;
    padding: 18px 12px; text-align: center; box-shadow: 4px 4px 0 var(--border);
  }
  .stat b { display: block; font-family: "Press Start 2P", monospace; font-size: clamp(20px, 3.4vw, 30px); margin-bottom: 10px; }
  .stat:nth-child(1) b { color: var(--red); }
  .stat:nth-child(2) b { color: var(--blue); }
  .stat:nth-child(3) b { color: var(--coin-dark); }
  .stat:nth-child(4) b { color: var(--green); }
  .stat span { font-weight: 700; font-size: 15px; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; counter-reset: step; }
  .step {
    background: var(--card); border: 3px solid var(--border); border-radius: 12px; padding: 20px;
    position: relative;
  }
  .step::before {
    counter-increment: step; content: counter(step);
    font-family: "Press Start 2P", monospace; font-size: 14px;
    position: absolute; top: -16px; left: 16px;
    background: var(--sky); color: #fff; border: 3px solid var(--border); border-radius: 8px;
    padding: 6px 9px;
  }
  .step h3 { margin: 8px 0 6px; font-size: 18px; }
  .step p { margin: 0; color: var(--muted); }

  .features { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .feature {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--card); border: 3px solid var(--border); border-radius: 12px; padding: 16px 18px;
  }
  .feature .ic { font-size: 28px; line-height: 1; flex: none; width: 36px; text-align: center; }
  .feature h3 { margin: 0 0 4px; font-size: 17px; }
  .feature p { margin: 0; color: var(--muted); font-size: 15px; }

  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .shots figure { margin: 0; }
  .shots img {
    border: 4px solid var(--border); border-radius: 16px; image-rendering: auto;
    box-shadow: 6px 6px 0 var(--border);
  }
  .shots figure:nth-child(1) { transform: rotate(-2deg); }
  .shots figure:nth-child(3) { transform: rotate(2deg); }

  .cta {
    text-align: center; padding: 44px 20px;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky-light) 100%);
    border: 4px solid var(--border); border-radius: 16px; box-shadow: 8px 8px 0 var(--border);
    color: #1d2a33; position: relative; overflow: hidden;
  }
  .cta::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px;
    background: var(--ground); border-top: 5px solid var(--green);
  }
  .cta h2 { color: #fff; text-shadow: 3px 3px 0 var(--border); margin-bottom: 14px; }
  .cta p { font-weight: 800; margin: 0 0 26px; }
  .cta .btn-play { margin-bottom: 18px; }

  footer {
    padding: 28px 0 40px; color: var(--muted); font-size: 14px;
    display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between;
  }
  footer nav { display: flex; gap: 18px; flex-wrap: wrap; }

  [data-lang-hidden] { display: none !important; }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; gap: 36px; padding-top: 10px; }
    .phone { transform: rotate(0); }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .steps { grid-template-columns: 1fr; gap: 26px; }
    .features { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    body { background-image: repeating-linear-gradient(180deg, transparent 0 31px, var(--line) 31px 32px); }
    .wrap { padding: 0 16px; }
    .brand span { display: none; }
    .shots { grid-template-columns: 1fr; max-width: 300px; margin: 0 auto; }
    .shots figure { transform: none !important; }
    .coin-float.c1, .coin-float.c3 { left: -12px; }
    .coin-float.c2 { right: -12px; }
  }

  /* ---------- language select ---------- */
  .lang { border: 3px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
  .lang select {
    font: inherit; font-family: "Press Start 2P", monospace; font-size: 10px;
    padding: 9px 10px; border: 0; background: var(--card); color: var(--ink);
    cursor: pointer; appearance: none; -webkit-appearance: none;
    padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .lang select:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- coin game ---------- */
  .coin-score {
    margin: 16px 0 0; font-size: 14px; color: var(--muted);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .coin-score b {
    font-family: "Press Start 2P", monospace; font-size: 15px; color: var(--coin-dark);
    min-width: 2ch;
  }
  .coin-hint { opacity: .75; }
  button.coin-float {
    padding: 0; cursor: pointer; appearance: none; -webkit-appearance: none;
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
    transition: transform .12s ease;
    z-index: 3;
  }
  button.coin-float:hover { transform: scale(1.18) translateY(-4px); }
  button.coin-float:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  button.coin-float.popped {
    animation: pop .32s ease forwards;
    pointer-events: none;
  }
  @keyframes pop {
    40% { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(.2) translateY(-26px); opacity: 0; }
  }
  .coin-plus {
    position: absolute; z-index: 4; pointer-events: none;
    font-family: "Press Start 2P", monospace; font-size: 12px;
    color: var(--coin-dark);
    text-shadow: 0 0 3px #fff, 1px 1px 0 var(--border);
    animation: rise .7s ease forwards;
    width: auto !important; height: auto !important;
    background: none !important; border: 0 !important; border-radius: 0 !important;
  }
  @keyframes rise {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-34px); }
  }
  @media (prefers-reduced-motion: reduce) {
    button.coin-float, .coin-plus { animation: none; transition: none; }
  }
</style>
</head>

  var KEY = 'pr_site_lang';
  var sel = document.getElementById('langSelect');

  function apply(lang) {
    var d = T[lang] || T.en;
    document.documentElement.lang = lang;
    document.title = d.docTitle;
    var m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute('content', d.lead);
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var v = d[el.getAttribute('data-i18n')];
      if (v !== undefined) el.textContent = v;
    });
    if (sel) sel.value = lang;
    try { localStorage.setItem(KEY, lang); } catch (e) {}
  }

  function detect() {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved && T[saved]) return saved;
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < list.length; i++) {
      var code = String(list[i]).toLowerCase();
      var base = code.split('-')[0];
      if (base === 'zh') return 'zh';
      if (T[base]) return base;
    }
    return 'en';
  }

  apply(detect());
  if (sel) sel.addEventListener('change', function () { apply(sel.value); });

  /* ---------- clickable coins ---------- */
  var zone = document.getElementById('coinZone');
  var out = document.getElementById('coinCount');
  if (zone && out && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var spots = [
      { top: '10%', left: '-34px', size: 38, delay: 0 },
      { top: '44%', right: '-30px', size: 30, delay: .6 },
      { bottom: '12%', left: '-24px', size: 26, delay: 1.2 },
      { top: '72%', right: '-22px', size: 24, delay: .3 },
      { top: '26%', right: '-38px', size: 34, delay: .9 },
      { bottom: '34%', left: '-36px', size: 32, delay: 1.5 }
    ];
    var score = 0;

    function makeCoin(spec) {
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'coin-float';
      c.setAttribute('aria-hidden', 'true');
      c.tabIndex = -1;
      c.style.width = spec.size + 'px';
      c.style.height = spec.size + 'px';
      c.style.animationDelay = spec.delay + 's';
      ['top', 'left', 'right', 'bottom'].forEach(function (k) {
        if (spec[k] !== undefined) c.style[k] = spec[k];
      });
      c.addEventListener('click', function () {
        if (c.classList.contains('popped')) return;
        c.classList.add('popped');
        score++;
        out.textContent = score;
        var spark = document.createElement('span');
        spark.className = 'coin-plus';
        spark.textContent = '+1';
        spark.style.cssText = c.style.cssText;
        spark.style.animationDelay = '0s';
        zone.appendChild(spark);
        setTimeout(function () { spark.remove(); }, 700);
        setTimeout(function () { c.remove(); makeCoin(spec); }, 2600);
      });
      zone.appendChild(c);
      return c;
    }
    spots.forEach(makeCoin);
  }
})();
